baseURL = "/"
title = "Echo-Unvaulted"
publishDir = "output"

# Use commit time to update the sitemap
enableGitInfo = true
enableRobotsTXT = true

disableKinds = ["taxonomy", "term", "RSS"]

[markup.goldmark.extensions.typographer]
  disable = true

# Lets the image render hook frame standalone images as figures
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Chroma syntax highlighting for docs code blocks, the stylesheet is generated
# from this style at build time into assets/css/chroma.css
[markup.highlight]
  noClasses = false
  style = "monokailight"

# Suppress individual character pages
[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    kind = "section"
    path = "/characters"

[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    kind = "page"
    path = "/characters/**"

[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    kind = "section"
    path = "/posts"

[frontmatter]
  lastmod = [":git", "date"]

[params]
  author = "/xivg/"

[params.sourceColors]
  lodestone = "yellow"
  conflict = "cyan"
  position = "blue"
