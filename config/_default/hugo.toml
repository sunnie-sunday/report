baseURL = "/"
title = "Echo-Unvaulted"
publishDir = "output"

# Use commit time to update the sitemap
enableGitInfo = true
enableRobotsTXT = true

disableKinds = ["taxonomy", "term", "RSS"]

[markup.goldmark.extensions.typographer]
  disable = true

# Lets the image render hook frame standalone images as figures
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Chroma syntax highlighting generated at build time
[markup.highlight]
  noClasses = false
  style = "monokailight"

# Suppress individual character pages
[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    kind = "section"
    path = "/characters"

[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    kind = "page"
    path = "/characters/**"

[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    kind = "section"
    path = "/posts"

# Suppress review pages
[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    kind = "section"
    path = "/reviews"

[[cascade]]
  [cascade.build]
    render = "never"
    # Only publish the resized avatars the homepage links to
    publishResources = false
  [cascade.target]
    kind = "page"
    path = "/reviews/**"

[frontmatter]
  lastmod = [":git", "date"]

[params]
  author = "/xivg/"

[params.sourceColors]
  lodestone = "yellow"
  conflict = "cyan"
  position = "blue"
