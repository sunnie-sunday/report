<!DOCTYPE html>
<html lang="en">
{{ partial "head.html" . }}
<body>
	<header class="site-header">
		<div class="site-header-top">
			<h1><a href="{{ "/" | relURL }}">{{ site.Title }}</a></h1>
		</div>
		<div class="site-description">
			<h2><a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a></h2>
		</div>
	</header>

	<main class="docs-body">
		<h1>{{ .Title }}</h1>
		{{ .Content | replaceRE `Severity: (LOW|MEDIUM|HIGH)` `Severity: <span class="severity severity-$1">$1</span>` | safeHTML }}
	</main>

{{ partial "footer.html" . }}
</body>
</html>
